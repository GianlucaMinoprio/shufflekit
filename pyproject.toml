[project]
name = "shufflekit"
version = "0.1.0"
description = "Flash music onto an iPod shuffle 3rd/4th gen without iTunes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gianluca Minoprio" }]
keywords = ["ipod", "shuffle", "itunes", "music", "retro"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GianlucaMinoprio/shufflekit"

[project.scripts]
shufflekit = "shufflekit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shufflekit*"]

[tool.setuptools.package-data]
shufflekit = ["static/*"]
