<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shufflekit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>shufflekit</h1>
    </div>
    <div class="top-meta">
      <span id="badge" class="badge">…</span>
      <span id="ver" class="muted mono"></span>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <div>
          <h2 id="device-line">Looking for a shuffle</h2>
          <p id="device-meta" class="muted">Plug it in.</p>
        </div>
        <span id="space" class="muted mono"></span>
      </div>

      <div id="drop" class="drop">
        <input id="file" type="file" accept=".mp3,.m4a,.m4b,.aac,.wav,audio/*" multiple />
        <p>Drop MP3 or AAC, or browse.</p>
      </div>

      <div class="actions">
        <button id="add" type="button">Add</button>
        <button id="orphans" type="button" class="outline">Include loose files</button>
        <button id="rebuild" type="button" class="ghost">Rebuild</button>
        <span id="status" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Apple Music</h2>
          <p class="muted">Browse playlists. DRM-free tracks copy directly. Apple Music streams record in real-time via BlackHole.</p>
        </div>
        <button id="pl-refresh" type="button" class="ghost">Refresh</button>
      </div>
      <div id="bh-status" class="bh-banner hidden">
        <p id="bh-msg" class="muted"></p>
        <div class="actions">
          <button id="bh-install" type="button" class="outline">Install BlackHole</button>
          <button id="bh-setup" type="button" class="ghost hidden">Open Audio MIDI Setup</button>
        </div>
      </div>
      <div id="playlist-list" class="pl-list"></div>
      <div id="pl-detail" class="pl-detail hidden">
        <div class="actions">
          <button id="pl-record" type="button">Record to shuffle</button>
          <span id="pl-status" class="muted"></span>
        </div>
        <div id="pl-progress" class="progress hidden">
          <div class="bar"><div id="pl-bar" class="fill"></div></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>On device</h2>
        <span id="count" class="badge">0</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="num">#</th>
              <th>File</th>
              <th class="num">Time</th>
            </tr>
          </thead>
          <tbody id="tracks"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
